<script>
  (function() {
    // Mode Switching Logic
    const tabPin = document.getElementById('tab-pin');
    const tabPass = document.getElementById('tab-pass');
    const pinView = document.getElementById('pin-view');
    const passView = document.getElementById('pass-view');

    tabPin.addEventListener('click', () => {
      tabPin.classList.add('bg-surface-container', 'font-semibold', 'text-on-surface');
      tabPin.classList.remove('text-on-surface-variant');
      tabPass.classList.remove('bg-surface-container', 'font-semibold', 'text-on-surface');
      tabPass.classList.add('text-on-surface-variant');
      pinView.classList.remove('hidden');
      passView.classList.add('hidden');
    });

    tabPass.addEventListener('click', () => {
      tabPass.classList.add('bg-surface-container', 'font-semibold', 'text-on-surface');
      tabPass.classList.remove('text-on-surface-variant');
      tabPin.classList.remove('bg-surface-container', 'font-semibold', 'text-on-surface');
      tabPin.classList.add('text-on-surface-variant');
      passView.classList.remove('hidden');
      pinView.classList.add('hidden');
    });

    // Password Visibility Toggle
    const pwdInput = document.getElementById('master-password-input');
    const toggleEye = document.getElementById('toggle-pwd-vis');
    const eyeIcon = document.getElementById('eye-icon');

    toggleEye.addEventListener('click', () => {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.textContent = 'visibility';
      } else {
        pwdInput.type = 'password';
        eyeIcon.textContent = 'visibility_off';
      }
    });

    // Numeric PIN input handling
    let currentPin = '';
    const pinDots = document.getElementById('pin-dots').children;
    const pinKeys = document.querySelectorAll('.pin-key');
    const pinClear = document.getElementById('pin-clear');
    const pinBack = document.getElementById('pin-back');
    const toast = document.getElementById('auth-status-toast');
    const toastText = document.getElementById('toast-text');
    const toastIcon = document.getElementById('toast-icon');

    function updatePinDots() {
      for (let i = 0; i < 6; i++) {
        if (i < currentPin.length) {
          pinDots[i].classList.remove('bg-surface-container-highest');
          pinDots[i].classList.add('bg-primary', 'shadow-sm', 'shadow-primary');
        } else {
          pinDots[i].classList.remove('bg-primary', 'shadow-sm', 'shadow-primary');
          pinDots[i].classList.add('bg-surface-container-highest');
        }
      }

      if (currentPin.length === 6) {
        showSuccessUnlock('PIN 验证成功，正在派生主加密秘钥...');
      }
    }

    pinKeys.forEach(btn => {
      btn.addEventListener('click', () => {
        if (currentPin.length < 6) {
          currentPin += btn.dataset.val;
          updatePinDots();
        }
      });
    });

    pinClear.addEventListener('click', () => {
      currentPin = '';
      updatePinDots();
    });

    pinBack.addEventListener('click', () => {
      currentPin = currentPin.slice(0, -1);
      updatePinDots();
    });

    // Biometric & YubiKey Interactions
    const bioBtn = document.getElementById('biometric-trigger');
    const yubikeyBtn = document.getElementById('yubikey-trigger');

    function showSuccessUnlock(msg) {
      toast.classList.remove('hidden');
      toastText.textContent = msg;
      toastIcon.textContent = 'lock_open';
      toastIcon.className = 'material-symbols-outlined text-primary text-[18px] animate-pulse';
      setTimeout(() => {
        toastText.textContent = '主金库解密完成，进入主界面...';
      }, 1200);
    }

    bioBtn.addEventListener('click', () => {
      showSuccessUnlock('生物验证通过 (Touch ID) · 正在解密私钥...');
    });

    yubikeyBtn.addEventListener('click', () => {
      toast.classList.remove('hidden');
      toastIcon.textContent = 'nfc';
      toastIcon.className = 'material-symbols-outlined text-secondary text-[18px]';
      toastText.textContent = '请将 YubiKey 5 NFC 贴合至手机天线处...';
      setTimeout(() => {
        showSuccessUnlock('FIDO2 物理凭据验证成功，金库已解锁！');
      }, 1500);
    });

    const submitMaster = document.getElementById('submit-master-password');
    submitMaster.addEventListener('click', () => {
      if (pwdInput.value.length > 0) {
        showSuccessUnlock('Argon2id 密钥派生中... 金库已就绪');
      } else {
        toast.classList.remove('hidden');
        toastIcon.textContent = 'error';
        toastIcon.className = 'material-symbols-outlined text-status-danger text-[18px]';
        toastText.textContent = '请输入主密码以进行解密';
      }
    });

    // Offline mode toggle
    const offlineBtn = document.getElementById('offline-switch-btn');
    let isOffline = false;
    offlineBtn.addEventListener('click', () => {
      isOffline = !isOffline;
      if (isOffline) {
        offlineBtn.innerHTML = '<span class="material-symbols-outlined text-[14px] text-status-warning">cloud_off</span><span class="font-label-sm text-label-sm text-status-warning">本地离线冷模式</span>';
      } else {
        offlineBtn.innerHTML = '<span class="material-symbols-outlined text-[14px] text-secondary">wifi_tethering</span><span class="font-label-sm text-label-sm">节点在线</span>';
      }
    });
  })();
</script></main></body></html>
