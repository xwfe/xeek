[package]
name = "keex-wasm-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# 路径由 build.py 解包并打完 K003 的补丁后生成；版本和原始校验和在那里核对。
keepass = { path = "target/source/keepass-0.15.3", default-features = false, features = ["save_kdbx4"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# 要和 .toolchain 里的 wasm-bindgen 命令行版本完全一致。
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# 崩溃就终止：Worker 整个丢弃重建，不在半坏的内存状态上继续跑。
# 原生目标用 CARGO_PROFILE_RELEASE_PANIC=unwind 编译，见 build.py：那里要接住 panic，不能带走主程序。
panic = "abort"
